; PlatformIO build config for the Waveshare ESP32-S3-ePaper-1.54 board.
; Module: ESP32-S3-PICO-1-N8R8 -> 8 MB flash (QIO) + 8 MB PSRAM (Octal / OPI).
;
;   pio run            # compile
;   pio run -t upload  # flash over USB-C
;   pio device monitor # serial @ 115200

[env:esp32-s3-epaper-154]
; Bumped from espressif32@6.9.0 to the pioarduino fork: the legacy driver/i2s.h
; on 6.9.0 (IDF 5.1) would not reliably emit MCLK, so the codec stayed silent.
; This fork ships Arduino core 3.x on IDF 5.3+, providing the new i2s_std driver
; the vendored esp_codec_dev framework requires.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board    = esp32-s3-devkitc-1
framework = arduino

; --- N8R8 memory: flash QIO 8MB, PSRAM Octal (OPI) ---
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

; Inject WiFi/URL secrets from .env (or the environment) as -D build flags.
extra_scripts = pre:inject_secrets.py

board_build.embed_files =
    src/urgent.pcm

build_flags =
    -DBOARD_HAS_PSRAM            ; PNGdec line buffers / GxEPD2 buffer can use PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1  ; route Serial over the native USB-C CDC port
    ; Vendored esp_codec_dev 1.5.10 gates per-codec includes in its defaults
    ; header behind these Kconfig macros; a PlatformIO/Arduino build does not
    ; generate them, so define the codecs this board uses (ES8311 out, ES7210 in).
    -DCONFIG_CODEC_ES8311_SUPPORT=1
    -DCONFIG_CODEC_ES7210_SUPPORT=1
    ; Vendored esp_codec_dev framework include roots (lib/audio).
    -Ilib/audio
    -Ilib/audio/codec_board
    -Ilib/audio/codec_board/drv
    -Ilib/audio/esp_codec_dev
    -Ilib/audio/esp_codec_dev/include
    -Ilib/audio/esp_codec_dev/interface
    -Ilib/audio/esp_codec_dev/device/include
    -Ilib/audio/esp_codec_dev/device/priv_include
    -Ilib/audio/esp_codec_dev/device/es8311
    -Ilib/audio/esp_codec_dev/device/es7210

monitor_speed = 115200
upload_speed  = 921600

; Pinned so the build is reproducible. GxEPD2 pulls in Adafruit GFX/BusIO via its
; library.json, but they're listed explicitly to lock the versions.
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    bitbank2/PNGdec@^1.1.3
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit BusIO@^1.17.2
